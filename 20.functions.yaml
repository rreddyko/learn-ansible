- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, shell, ansible"
    names:
    - Ramesh
    - Reddy
    - kotha
  tasks:
  - name: filters
    debug:
      msg: "Hi {{ person_name | default('Rama') }}"
  - name: convert string to list
    debug:
      msg: "Topics are {{ topics | split(',') }}"
  - name:
    debug:
      msg: "Name is {{ names | join}}"
    