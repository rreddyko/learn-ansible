- name: course info
  hosts: local
  connection: local
  vars:
    course: "dev with secops"
    duration: 150
    live_session: true
    topics: #list
    - linux
    - shell
    - ansible
    - terraform
    more_details: #dictionary/map
      trainer: ramesh
      months: 4 
    exact_duiration: 4.5
  tasks:
  - name: print info and tpes
    debug:
      msg: |
        name: "{{ course }} : {{ course | type_debug }}"
        duration: "{{ duration }} : {{ duration | type_debug }}"
        is live: "{{ live_session }}" : {{ live_session | type_debug }}"
        topics are: "{{ topics }}" : {{ topics | type_debug }}"
        more details: "{{ more_details }}" : {{ more_details | type_debug }}"

