- name: install nginx
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx in redhat
    dnf: 
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat" 

  - name: print debian
    dnf:
      name: nginx
      state: present
    when: ansible_facts.os_family == "debian"