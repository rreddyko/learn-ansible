- name: creating user
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: user exists
    command: id roboshop
    register: user_exists
    ignore_errors: true

  - name: print the output
    debug:
      msg: "{{ user_exists}}"

  - name: Creating user now
    command: useradd roboshop
    when: user_exists.rc != 0
  