- name: ShellvsCommand
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: shell
    shell: cat /etc/passwd | grep ec2-user
    register: ec2_user_output
  - name: print command output
    debug:
      msg: "{{ ec2_user_output}}"
  - name: shell for ls
    shell: ls -la > /tmp/files.txt
    register: files_ouput
  
  - name: print files
    debug:
      msg: "{{ files_ouput }}"
